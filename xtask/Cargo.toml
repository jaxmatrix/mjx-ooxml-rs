[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Developer automation for mjx-ooxml-rs (schema codegen, etc.)."
publish = false

[lints]
workspace = true

[dependencies]
mjx-ooxml-core.workspace = true
mjx-xml.workspace = true
anyhow.workspace = true
# The fuzz campaign's targets are the three untrusted-input entry points, so it reaches the crates
# that own them. All three edges point downward from a host-only developer binary that nothing
# depends on, and `mjx-fixtures` (which supplies the seed corpus) has no dependencies at all.
mjx-opc.workspace = true
mjx-mce.workspace = true
mjx-fixtures.workspace = true
# The large-file corpus (MJXOFF-147): the PowerPoint deck is built through the real edit surface
# rather than invented markup, which is the one format this workspace has a model for. WordprocessingML
# and SpreadsheetML have no model yet (Phase C/D), so their corpus files are built directly on
# `mjx-opc`, already a dependency above. Another downward edge from a host-only binary nothing
# depends on — the same shape as the three fuzz edges above.
mjx-pptx.workspace = true
mjx-ooxml-types.workspace = true
# `GuideOperator` — the guide-formula operator table and its arity — so the preset-geometry
# extractor's completeness gate checks against the *same* function the resolver checks against
# rather than against a second copy of §20.1.9.11's argument counts. A downward edge from a
# host-only binary nothing depends on, like the two above it.
mjx-dml.workspace = true
# The fuzz campaign's memory ceiling (MJXOFF-146), extracted to its own crate by MJXOFF-95 so a
# `mjx-sml` test binary can install the same allocator — nothing may depend on `xtask`, and a second
# `unsafe impl GlobalAlloc` is the last thing this workspace should have two of.
mjx-allocation-counter.workspace = true
# The validation harness (MJXOFF-122) drives the *facade* and nothing below it: every artefact the
# human Office pass reads is produced by a `Deck`, `Document` or `Workbook` caller, so the pass
# validates A9's facade and its error mapping as a side effect. Another downward edge from a
# host-only binary nothing depends on.
mjx-ooxml.workspace = true
# MJXOFF-95's cell store, so `corpus --mem xlsx` can report what *holding* the corpus worksheet costs
# once it is a packed store rather than a `RawElement` tree — the figure that harness exists to make
# comparable. Another downward edge from a host-only binary nothing depends on.
mjx-sml.workspace = true
# The shared ECMA-376 gate. `tests/validation_harness.rs` holds every artefact the validation
# generators produce to the same schema, child-order and category rules the three format crates are
# held to, rather than writing a fourth harness — and MJXOFF-130's `validation-artefacts --ingest`
# hands an Office-authored file back with those same verdicts *reported* rather than asserted, which
# is a command rather than a test and so needs the gate as an ordinary dependency.
#
# This does not put a test-only crate into anything shipped. `xtask` is host-only, `publish = false`
# and outside the shipped graph; `xtask/tests/layering.rs` is what enforces the distinction, and it
# refuses a test-only crate as a normal dependency of every *ranked* member while allowing it here
# for exactly this reason. The alternative was a second child-order walk and a second schema call
# inside `xtask`, which is the duplication this workspace deleted fourteen of.
mjx-schema-gate.workspace = true
# Rank 0.2. **The contrast rule of `DESIGN_TOKENS.md` §2.2, which this generator now calls rather
# than owns** (MJXOFF-166). It was a private `check_usage` here beside a private copy of the WCAG
# arithmetic, which made the generator the only thing in the workspace able to apply the rule — and
# the generator is not the only writer of `docs/client-platform/data/tokens.json`. The canvas
# harness's live token editor writes back to that file and may not depend on `xtask`, so a bad text
# colour was accepted at the keystroke and failed the next `tokens` run. The rule moved down into
# the crate every writer can reach; this edge is what keeps there being one copy of it. Another
# downward edge from a host-only binary nothing depends on.
mjx-tokens.workspace = true
