name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast`: a plain `cargo test` stops at the first failing test *binary*, so a second
      # broken crate is invisible until the first is fixed — one round trip per defect.
      - name: test
        run: cargo test --workspace --no-fail-fast
      # The `vml` feature gates a whole surface — the typed VML model and the `spid` resolution an
      # OLE object's legacy fallback needs — so the default-feature run above compiles none of it.
      - name: clippy (vml feature)
        run: cargo clippy --workspace --all-targets --features mjx-pptx/vml -- -D warnings
      - name: test (vml feature)
        run: cargo test --workspace --features mjx-pptx/vml --no-fail-fast

  # Every feature of every crate at once. `lint-test` above runs the default features and the one
  # `vml` combination; neither compiles the binding crates' feature surface, and neither is what a
  # `cargo test --workspace --all-features` consumer gets.
  #
  # This job exists because a *documentary* fix already failed. `test (vml feature)` ran on every
  # pull request, went red at one merge and stayed red through the next, while the process document
  # said "the main agent watches CI". A gate converges only when something forces someone to look at
  # its output — so this job is required, and the merge step is a command whose exit status gates
  # the merge (`gh pr checks --required`) rather than a sentence instructing a person to look.
  all-features:
    name: test (--all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test (--all-features)
        run: cargo test --workspace --all-features --no-fail-fast

  # The naming convention this repository is built on — a public identifier is self-explanatory to a
  # reader who does not have ECMA-376 open — has exactly one enforcement mechanism per rule that is
  # worth enforcing, and a rule enforced by "remember to grep" is a rule that decays. `c:delete`
  # markup ("draw nothing here") is spelled `suppress_*` / `suppressed` on the surface, because
  # `delete_*` sat beside `remove_*` ("say nothing here") and read as its synonym. Needs no
  # toolchain, so it reports in seconds instead of behind a Rust build.
  naming:
    name: naming (`suppress`, not `delete`)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no identifier spells this concept `delete`
        run: .github/scripts/check-suppress-naming.sh

  # Enforce a clean, complete rustdoc build (missing docs are already denied via clippy; this also
  # catches broken intra-doc links, which clippy does not).
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: doc
        run: cargo doc --workspace --no-deps
      # And again with the `vml` feature, whose items the default build does not compile at all.
      - name: doc (vml feature)
        run: cargo doc --workspace --no-deps --features mjx-pptx/vml

  # Every deck this library authors, and every committed fixture part, validated against the
  # ECMA-376 XSDs. Round-tripping proves we do not corrupt a file and office-open proves a deck
  # *opens* — neither proves the markup we *write* is legal. LibreOffice happily opened two invalid
  # parts for 58 releases; this is the job that would have caught them.
  #
  # Why the schemas are fetched rather than committed: `References/` is git-ignored by a standing
  # rule of this repository, and whether ECMA-376 schema files may be redistributed inside the tree
  # is a decision reserved for the repository owner. So the two published archives are downloaded,
  # verified against the committed SHA-256 manifest `.github/ecma-376-archives.sha256`, and
  # extracted into `References/` — exactly the layout a developer already has, and the one
  # `schema_validity.rs` discovers with no environment variables set.
  #
  # The *archives* are cached (not the extracted XSDs) and the checksum is re-checked on every run,
  # hit or miss: a truncated download or a poisoned cache entry is then a hard failure instead of a
  # silently different schema set. The cache key is the manifest's own hash, so pinning a different
  # archive re-fetches automatically.
  #
  # MJX_REQUIRE_SCHEMA=1 turns a missing tool or schema tree into a hard failure, so this coverage
  # can never silently skip in CI — the same pattern office-open uses with MJX_REQUIRE_SOFFICE.
  # Locally the same suite still skips cleanly when `References/` is absent.
  schema-validity:
    name: schema-validity (ECMA-376 XSDs)
    runs-on: ubuntu-latest
    env:
      MJX_REQUIRE_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # xmllint is the validator. It ships in the current runner image, but installing it explicitly
      # keeps the job independent of image drift — and a missing xmllint would otherwise be caught
      # only by MJX_REQUIRE_SCHEMA, one step later and with a worse message.
      - name: install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: cache the ECMA-376 archives
        uses: actions/cache@v4
        with:
          path: References/*.zip
          key: ecma-376-archives-${{ hashFiles('.github/ecma-376-archives.sha256') }}

      - name: fetch, verify and extract the ECMA-376 schemas
        run: .github/scripts/fetch-ecma-schemas.sh

      # `--features vml` so the authored-VML case is compiled: without it that deck is never built
      # and its content types are never validated.
      - name: schema-validity suite (PowerPoint, and the whole-workspace meta-gate)
        run: cargo test -p mjx-pptx --features vml --test schema_validity

      # The same harness pointed at the other two formats. `mjx-docx` and `mjx-xlsx` carry no model
      # code yet; these are the gates Phases C and D inherit, and they are what makes "the schema
      # gate covers Word" a fact instead of a sentence.
      - name: schema-validity suite (Word and Excel)
        run: cargo test -p mjx-docx -p mjx-xlsx -p mjx-schema-gate

      # The validation harness and the Office-authored corpus. Both reach the gate, and both had
      # their schema halves **skipping in every CI run** before this step existed: they live in
      # `xtask/tests/`, which only `lint-test` ran, and `lint-test` has no `References/`. So
      # `every_generated_artefact_is_schema_valid_and_in_child_order` validated nothing on CI, and
      # the MCE/CT_Extension reproduction (MJXOFF-196) returned early. That is precisely the
      # "green because it was skipped" shape this file's other jobs are written against.
      #
      # MJX_REQUIRE_OFFICE_CORPUS is deliberately NOT set: the corpus is empty and no agent may fill
      # it. Set it here once `tests/office-authored/` has files, and an empty corpus becomes a
      # failure rather than a reported count.
      - name: schema-validity suite (the validation harness and the Office corpus)
        run: cargo test -p xtask --test validation_harness --test office_corpus

  # The Phase-2 exit gate: a .pptx or .docx we construct actually opens in a real Office
  # implementation. Kept separate from lint-test so the heavy LibreOffice install cannot slow or
  # flake the fast lane. MJX_REQUIRE_SOFFICE=1 turns a missing binary into a hard failure, so this
  # coverage can never silently skip in CI (locally the same tests skip cleanly when LibreOffice is
  # absent).
  #
  # **Every crate with an `office_open` suite must be named on the canary step**: a package filter
  # that names only some of them silently drops the rest with the job still reporting green
  # (MJXOFF-98 found exactly this — Word's four cases had never executed anywhere, here or locally,
  # because this step named `-p mjx-pptx` alone; MJXOFF-112 added Excel's four and had to widen the
  # filter again). Likewise each component is required — `libreoffice-impress` (PowerPoint/Impress),
  # `libreoffice-writer` (Word/Writer) and `libreoffice-calc` (Excel/Calc): `soffice` cannot convert
  # an `.xlsx` to PDF with only Impress and Writer installed.
  office-open:
    name: office-open (LibreOffice)
    runs-on: ubuntu-latest
    env:
      MJX_REQUIRE_SOFFICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install LibreOffice Impress, Writer and Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress libreoffice-writer libreoffice-calc
      - name: office-open canary
        run: cargo test -p mjx-pptx -p mjx-docx -p mjx-xlsx --test office_open

      # The reference pack (MJXOFF-207). Three things are being held here and only the first is
      # about LibreOffice: that the four artefacts a Windows sitting needs actually generate and
      # convert, that every one of the 187 presets gets a row in the preliminary pass rather than
      # being silently dropped, and that the four typography readers work on a PDF this project did
      # not write. MJX_REQUIRE_SOFFICE and MJX_REQUIRE_TOOLS (set below) turn a missing converter or
      # a missing poppler into a failure, so this coverage can never quietly skip.
      #
      # **What it deliberately does not gate on is agreement.** A LibreOffice disagreement is a
      # thing to look at before the sitting, and making it a build failure would be the first step
      # towards editing correct code until it matches a reference that is explicitly not
      # authoritative. The suites assert that every plate has a row and that none of it is parity.
      - name: the reference pack, and the preliminary pass over all 187 presets
        env:
          MJX_REQUIRE_TOOLS: "1"
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          cargo test -p mjx-reference-pack

      # The guide's headline example must produce a deck a real Office implementation opens.
      # Documentation that cannot be executed is a claim; this makes it a gate.
      - name: the guide's deck opens
        run: |
          cargo run -p mjx-pptx --example build_a_deck -- guide_deck.pptx
          soffice --headless --convert-to pdf --outdir . guide_deck.pptx
          test -s guide_deck.pdf

      # The same gate for Excel (MJXOFF-135). `office_open.rs` already proves an authored-and-filled
      # workbook opens; this proves the workbook the *guide's example* actually writes does, which is
      # the artefact a reader will copy. Calc is installed above for exactly this.
      - name: the guide's workbook opens
        run: |
          cargo run -p mjx-xlsx --example build_a_workbook -- guide_workbook.xlsx
          soffice --headless --convert-to pdf --outdir . guide_workbook.xlsx
          test -s guide_workbook.pdf

      # And the workbook the *facade* writes (MJXOFF-137), which is a different authoring path: the
      # curated surface, its batched `write_cells`, and its own cell-format vocabulary. One
      # conversion covers all three languages, because `test_build_a_workbook.py` and
      # `build_a_workbook.mjs` are each compared against this file part by part, byte for byte.
      - name: the facade's workbook opens
        run: |
          cargo run -p mjx-ooxml --example build_a_workbook -- facade_workbook.xlsx
          soffice --headless --convert-to pdf --outdir . facade_workbook.xlsx
          test -s facade_workbook.pdf

  # The painter, on a graphics device that actually exists (MJXOFF-163).
  #
  # **A GitHub-hosted runner has no GPU**, which is exactly the situation this job is written for. A
  # rendering suite that treated "no adapter" as "nothing to do" would be green precisely when the
  # work was skipped — this project's signature failure — so:
  #
  #   * `mesa-vulkan-drivers` installs `lavapipe`, a *real* Vulkan implementation that rasterises on
  #     the processor. It is enumerated as an ordinary adapter, so nothing is faked and nothing is
  #     forced: `force_fallback_adapter` stays `false` and the painter reports `device_type: Cpu`,
  #     which is the honest answer and is what the suites print.
  #   * `MJX_REQUIRE_GPU=1` turns a missing device into a **failure** rather than a skip, exactly as
  #     `MJX_REQUIRE_SCHEMA` and `MJX_REQUIRE_SOFFICE` already do for their tools. Locally the same
  #     suites skip cleanly and say so by name.
  #   * `vulkaninfo --summary` runs first and is *reported*, so the log says which implementation the
  #     frames were drawn by rather than leaving a reader to assume.
  #
  # `wgpu`'s null backend is deliberately not compiled into this workspace (see the `wgpu` feature
  # list in `Cargo.toml`); with it, this job would pass on a machine with no graphics stack at all.
  render:
    name: render (software Vulkan)
    runs-on: ubuntu-latest
    env:
      MJX_REQUIRE_GPU: "1"
      # And the two **independent readers** the exporters are checked with (MJXOFF-164). Same shape,
      # same reason: `pdftotext` reading a word back out of our PDF is the one assertion that
      # separates text from a picture of text, and a suite that skipped it silently on a runner
      # without poppler would be green precisely because it checked nothing. Checking our own export
      # with our own reader would prove nothing whatever, which is why these are external tools.
      MJX_REQUIRE_TOOLS: "1"
      # Mesa's software rasteriser for the OpenGL path too, so that a `wgpu` build which prefers GL
      # on this runner still finds something rather than reporting an absence that is not real.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install a software Vulkan implementation and the two document readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1-mesa-dri \
            poppler-utils libxml2-utils
      - name: which implementation is present
        run: vulkaninfo --summary || true
      - name: which readers are present
        run: |
          pdftotext -v || true
          xmllint --version || true
      - name: the painter's own suites, with a missing device or reader as a failure
        run: cargo test -p mjx-paint --no-fail-fast -- --nocapture

  # The fidelity oracle (MJXOFF-165). Its own job rather than a line in `lint-test`, for two
  # reasons that are both about what a reviewer can see.
  #
  # **The external readers are the point.** `pdftotext` and `pdftoppm` check our own PDF export,
  # `magick` reads our own PNG back — dimensions, pixels and the straight-alpha convention — and
  # `sha256sum` reproduces the digest an approval record binds to. Checking our own output with our
  # own reader proves nothing whatever, which is why all four are external and why
  # `MJX_REQUIRE_TOOLS=1` turns a missing one into a **failure** rather than a named skip.
  #
  # **And the gallery is uploaded on failure.** MJXOFF-165's own constraint is that a failure a
  # reviewer cannot see is a failure nobody fixes: a pixel-tier regression is a picture, and a
  # number in a log is not one. The gallery is a single self-contained HTML file beside the plates,
  # so the artefact opens on a machine with nothing installed.
  #
  # What this job deliberately does **not** gate on is fidelity. Every baseline it checks was
  # produced by the code it is checking; that catches a regression and is not a parity claim, and
  # `crates/mjx-render-oracle/src/lib.rs` says so at length.
  oracle:
    name: the fidelity oracle
    runs-on: ubuntu-latest
    env:
      MJX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install the readers this workspace did not write
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
      - name: which readers are present
        run: |
          pdftotext -v || true
          pdftoppm -v || true
          magick -version || true
      - name: the three tiers, the approval gates and the instruments
        run: cargo test -p mjx-render-oracle --no-fail-fast -- --nocapture
      - name: the plate gallery, so a failure can be looked at
        if: always()
        run: cargo run -p mjx-render-oracle -- gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-gallery
          path: target/oracle-gallery
          if-no-files-found: error

  # Every example runs, and every example reopens its own output and asserts something about it.
  # `cargo clippy --all-targets` in lint-test already compiles them; this proves they *work*.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run every example
        run: |
          # Every crate that has examples, not only `mjx-pptx`: the facade's `build_a_deck` is the
          # deck the two bindings are checked against, so it has to run here too.
          for directory in crates/*/examples; do
            package=$(basename "$(dirname "$directory")")
            for example in "$directory"/*.rs; do
              name=$(basename "$example" .rs)
              echo "::group::$package $name"
              cargo run -p "$package" --example "$name"
              echo "::endgroup::"
            done
          done
      # `legacy_content` takes a different path under the `vml` feature — the half that resolves an
      # OLE object to the VML shape that draws it — so it runs a second time with the feature on.
      - name: run the legacy-content example with the vml feature
        run: cargo run -p mjx-pptx --features vml --example legacy_content

  # Prove the shipped library graph cross-compiles cleanly to mobile / wasm / desktop.
  # xtask is a host-only dev tool (schema codegen, and the fuzz campaign — MJXOFF-146), so it is
  # excluded from cross builds. The campaign itself is deliberately on NO CI job: it has no natural
  # end, and a run short enough for a push is a run that finds nothing. See CONTRIBUTING.md.
  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: wasm32-unknown-unknown, os: ubuntu-latest }
          - { target: aarch64-linux-android,  os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-ios,      os: macos-latest }
          - { target: aarch64-apple-darwin,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The two binding members are excluded on purpose. A PyO3 `cdylib` needs a Python interpreter
      # for the *host* being built for, which no cross target has; a wasm-bindgen `cdylib` means
      # nothing outside `wasm32`, and is built properly by the `wasm-pack` job below. What this job
      # proves — that the shipped library graph cross-compiles — is unaffected.
      # `mjx-schema-gate`, `mjx-fixtures`, `mjx-reference-pack` and `mjx-render-oracle` are excluded
      # for the same reason read the other way: they are test-only, `publish = false`, and nothing
      # shipped depends on them, so building them for five targets would widen the claim this job
      # makes rather than support it. The reference pack was the first member here with a
      # **binary**, and a binary has to *link*: the Android leg has no NDK linker, so `cargo build
      # --target aarch64-linux-android` fed its object files to the host `ld` and got *"Relocations
      # in generic ELF (EM: 183)"*. A library target only ever produces an `rlib` and never hits
      # that. The fidelity oracle has a binary too, and the same exclusion for the same reason.
      # `shell: bash` is load-bearing on the Windows leg: the default shell there is `pwsh`, which
      # reads the backslash line-continuations below as a unary `--` and fails to parse the step
      # before cargo is ever invoked. The `python-wheel` job already sets it for the same reason.
      - name: build (lib graph)
        shell: bash
        run: |
          cargo build --workspace --exclude xtask \
            --exclude mjx-python --exclude mjx-wasm \
            --exclude mjx-schema-gate --exclude mjx-fixtures \
            --exclude mjx-reference-pack --exclude mjx-render-oracle \
            --target ${{ matrix.target }}

  # The two binding members, built and linted on the host. `lint-test` already covers them as part of
  # `--workspace`; this job builds them the way they ship — the Python one with `extension-module`,
  # the wasm one for `wasm32` — which `--workspace` on the host does not.
  bindings-build:
    name: bindings-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # The claim each binding crate makes in its `#![allow(unsafe_code)]` justification is that no
      # `unsafe` is hand-written — every unsafe block comes from `#[pyclass]` or `#[wasm_bindgen]`.
      # A claim CI does not check is a claim that quietly stops being true, so this checks it: any
      # `unsafe` in a binding's own sources, outside a comment and outside the crate-level
      # `#![allow(unsafe_code)]` attribute, fails the build.
      #
      # This is the workspace's first use of the `deny`-not-`forbid` escape hatch in
      # `[workspace.lints.rust]`; `forbid` would have made the macros' own expansions impossible.
      - name: no hand-written `unsafe` in the bindings
        run: |
          offenders=$(grep -rn '\bunsafe\b' bindings/*/src bindings/*/tests 2>/dev/null \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
            | grep -vF '#![allow(unsafe_code)]' \
            || true)
          if [ -n "$offenders" ]; then
            echo "hand-written \`unsafe\` found in a binding crate:"
            echo "$offenders"
            echo
            echo "The bindings carry \`#![allow(unsafe_code)]\` on the stated grounds that every"
            echo "unsafe block is macro-generated. Adding one by hand needs its own justification"
            echo "and its own review — and this check updated to permit it explicitly."
            exit 1
          fi
          echo "no hand-written \`unsafe\` in bindings/*/src or bindings/*/tests"

      # The same claim, for the platform boundary (MJXOFF-163), and the same principle: a claim CI
      # does not check is a claim that quietly stops being true. `mjx-paint` is the fourth crate with
      # a local `#![allow(unsafe_code)]`, and unlike the bindings it *does* contain one hand-written
      # unsafe block — the surface created from a window handle the shell supplied, which no safe API
      # can express. So the rule here is not "none" but "exactly the marked one": any `unsafe`
      # keyword in `crates/mjx-paint/src`, outside a comment and outside the crate-level attribute,
      # must carry `MJX-PAINT-SURFACE-UNSAFE` on its own line.
      #
      # `grep -w` rather than a bare match, because `create_surface_unsafe` and
      # `SurfaceTargetUnsafe` are identifiers: a scan that could not tell a keyword from an
      # identifier would report the very call the crate is built around and fail for ever.
      # `crates/mjx-paint/tests/the_seam_holds.rs` asserts the same rule with the same word-boundary
      # definition, one round trip earlier, and additionally that exactly one line carries it.
      - name: only the marked `unsafe` in the platform boundary
        run: |
          offenders=$(grep -rnw 'unsafe' crates/mjx-paint/src 2>/dev/null \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
            | grep -vF '#![allow(unsafe_code)]' \
            | grep -vF 'MJX-PAINT-SURFACE-UNSAFE' \
            || true)
          if [ -n "$offenders" ]; then
            echo "unmarked hand-written \`unsafe\` in crates/mjx-paint/src:"
            echo "$offenders"
            echo
            echo "\`mjx-paint\` carries \`#![allow(unsafe_code)]\` on the stated grounds that it has"
            echo "exactly one unsafe block: the surface created from a window handle the shell"
            echo "supplied, whose validity is the window system's invariant. Adding another needs"
            echo "its own justification and its own review — and this check, and the crate's own"
            echo "\`the_seam_holds.rs\`, updated to permit it explicitly."
            exit 1
          fi
          marked=$(grep -rncw 'unsafe' crates/mjx-paint/src 2>/dev/null \
            | awk -F: '{ total += $2 } END { print total + 0 }')
          echo "crates/mjx-paint/src: $marked \`unsafe\` line(s), all carrying the marker"

      - name: build the Python extension module
        run: cargo build -p mjx-python --features extension-module --release
      - name: build the WebAssembly module
        run: cargo build -p mjx-wasm --release --target wasm32-unknown-unknown
      - name: clippy (bindings, `vml` feature on)
        run: |
          cargo clippy -p mjx-python -p mjx-wasm --all-targets --features mjx-python/vml,mjx-wasm/vml \
            -- -D warnings

  # The WebAssembly package: both targets, the Rust side in a real wasm runtime (headless Chrome and
  # Node), the published shape driven from Node, and a size report.
  wasm-pack:
    name: wasm-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned, not `latest` (MJXOFF-139): `jetli/wasm-pack-action@v0.4.0`'s `latest` resolution is
      # broken independently of anything in this repository — on this run it installed wasm-pack
      # v0.9.1 (from 2020) against the real latest release, v0.15.0. v0.9.1 bundles a Cargo-manifest
      # parser that predates workspace-inherited fields (`license.workspace = true`, stable since
      # Cargo 1.64), which every crate in this workspace uses, so the job failed at
      # "failed to parse manifest: bindings/mjx-wasm/Cargo.toml" before running a single test — not a
      # regression in this PR's own commits (`bindings/mjx-wasm/Cargo.toml`'s `license.workspace =
      # true` predates this branch entirely, from MJX-210) and not fixable by anything this branch's
      # own diff could touch other than this pin. Verified against the actual release feed
      # (`https://api.github.com/repos/rustwasm/wasm-pack/releases/latest` → `v0.15.0`, matching this
      # workspace's locally installed `wasm-pack --version`) before pinning to it.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      # In a browser, because that is the runtime this binding exists for. `wasm-pack test` starts
      # the driver itself; the runner image ships Chrome.
      - name: wasm tests (headless Chrome)
        run: wasm-pack test --headless --chrome bindings/mjx-wasm
      - name: wasm tests (Node)
        run: wasm-pack test --node bindings/mjx-wasm

      - name: build the npm package (both targets)
        run: bindings/mjx-wasm/build-npm.sh

      # The `.d.ts` files are wasm-pack's output, not a committed artefact, so the `naming` job
      # cannot see them — but they are the surface a TypeScript caller actually reads, including the
      # mangled `_bg.wasm.d.ts` export names, which are derived from the Rust method names. Scanning
      # them here proves the generated declarations agree with the sources the `naming` job scanned.
      - name: no identifier spells this concept `delete` in the generated declarations
        run: .github/scripts/check-suppress-naming.sh bindings/mjx-wasm/npm/dist

      # The published shape: the generated glue, the `.d.ts`, and the conditional exports — driven
      # exactly as an application would drive them. Includes the walkthrough comparison, which runs
      # the Rust example and checks the two decks part by part.
      - name: node smoke tests
        run: node --test "bindings/mjx-wasm/tests/node/*.mjs"

      # Reported, not gated. The specification asked for a measurement before a budget, and a budget
      # nobody has justified is a number that fails a build for the wrong reason.
      - name: size report
        run: |
          wasm=bindings/mjx-wasm/npm/dist/bundler/mjx_ooxml_bg.wasm
          raw=$(stat -c %s "$wasm")
          gzipped=$(gzip -9 -c "$wasm" | wc -c)
          brotli=$( (command -v brotli >/dev/null && brotli -q 11 -c "$wasm" | wc -c) || echo "n/a")
          {
            echo "### WebAssembly payload"
            echo
            echo "| encoding | bytes | KiB |"
            echo "|---|---:|---:|"
            echo "| raw | $raw | $((raw / 1024)) |"
            echo "| gzip -9 | $gzipped | $((gzipped / 1024)) |"
            [ "$brotli" != "n/a" ] && echo "| brotli -q 11 | $brotli | $((brotli / 1024)) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            bindings/mjx-wasm/npm/package.json
            bindings/mjx-wasm/npm/README.md
            bindings/mjx-wasm/npm/dist/
          if-no-files-found: error

  # The Python wheel: abi3, built on three operating systems, installed from the wheel rather than
  # from the source tree, then tested and type-checked against the committed stubs.
  python-wheel:
    name: python-wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          # 3.9 is the abi3 floor. A wheel built here must import on every later version, which the
          # second interpreter below checks.
          python-version: "3.9"

      - name: install the build and test tools
        run: python -m pip install --upgrade pip maturin pytest mypy

      # One wheel per platform rather than one per interpreter version: `abi3-py39` links only the
      # stable ABI, so the same file works on 3.9 and on everything after it.
      - name: build the abi3 wheel
        run: maturin build --release --out dist
        working-directory: bindings/mjx-python

      - name: install it (from the wheel, not the source tree)
        shell: bash
        run: python -m pip install --force-reinstall bindings/mjx-python/dist/*.whl

      # From a directory that is *not* the package's own, so an accidental relative import fails
      # here rather than in a user's environment.
      - name: pytest
        run: python -m pytest bindings/mjx-python/tests -q

      - name: mypy --strict
        run: python -m mypy --strict
        working-directory: bindings/mjx-python

      # The wheel claims to work on every version from 3.9 up. Installing it on a much later
      # interpreter is the cheapest way to find out whether that is true.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the same wheel imports on a later interpreter
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --force-reinstall bindings/mjx-python/dist/*.whl
          python -c "import mjx_ooxml; print(mjx_ooxml.__version__, len(mjx_ooxml.__all__))"
          python -m pytest bindings/mjx-python/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: bindings/mjx-python/dist/*.whl
          if-no-files-found: error
