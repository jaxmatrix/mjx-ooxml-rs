[package]
name = "mjx-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typography for the client platform: face parsing and metrics, the system font database, the metric-compatible substitution table, shaping, bidirectional resolution, itemisation, line breaking and hyphenation."

# The bundled tier-2 faces and their licences ship with the crate: an application that vendors
# `mjx-text` and points `BundledFonts::from_directory` at this path gets a working tier 2 without
# hunting for the files, and the OFL's "distribute the licence alongside" obligation travels with
# them. Everything else a package would otherwise sweep up is excluded.
include = [
    "src/**/*.rs",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
    "assets/fonts/README.md",
    "Cargo.toml",
]

[lints]
workspace = true

[dependencies]
# Rank 0.0. Family names repeat once per run in a document with thousands of runs, which is exactly
# the string the interner exists for; `Symbol` is what the manifest and the resolver's caches key on.
mjx-ooxml-core.workspace = true
# Rank 0.2 (MJXOFF-156). The chrome's own type is named by tokens, and a `FontStack` is a CSS font
# list; resolving one is this crate's job, so the token table is where the request comes from.
mjx-tokens.workspace = true
thiserror.workspace = true
# The face parser. Pure Rust, no allocation on the parse path, and it returns `Option`/`Result`
# rather than panicking on malformed input — which is the property that matters here, because a font
# file inside a `.pptx` is exactly as untrusted as the `.pptx`.
ttf-parser.workspace = true
# The system font index. `default-features = false` on purpose:
#   * `memmap` would pull `memmap2`, whose mapping cannot be made sound on a platform where another
#     process may truncate the file underneath us, and which does not build for `wasm32`;
#   * `fs` and `fontconfig` are pure Rust and are what makes tier 1 real on desktop and Android.
# Tier 1 being *absent* is a supported configuration (iOS), so nothing here is load-bearing.
fontdb = { workspace = true, default-features = false, features = ["std", "fs", "fontconfig"] }
# The shaper (MJXOFF-158). Pure Rust, and a port of the engine Office itself shapes with, so what it
# does with an Arabic joining form or a Devanagari cluster is what Word does with one. It reads faces
# through the same `ttf-parser` version declared above, so a face this crate parsed and a face the
# shaper parsed can never disagree.
rustybuzz.workspace = true
# The rasteriser (MJXOFF-159). Pure Rust, and the one dependency here that is taken for its *output*
# rather than its behaviour: the TrueType hinting interpreter, the scan converter and the
# `COLR`/`CPAL` layer compositor are each a body of arithmetic over untrusted tables that this crate
# would otherwise have to write and defend itself. It parses faces with `skrifa`, not the
# `ttf-parser` above, which is exactly why `FontFace` hands out bytes plus an index: each parser
# reads the file for itself, and neither is ever given the other's view of it.
swash.workspace = true
# UAX #9 (bidirectional), UAX #14 (line breaking), UAX #29 (grapheme and word boundaries), and the
# ISO 15924 script table. All four are data plus a documented algorithm, all pure Rust, and none of
# them allocates on a path this crate takes per glyph.
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-script.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# The counting global allocator, so `tests/glyph_atlas_allocation.rs` asserts the atlas's byte
# ceiling instead of asserting it by inspection. Dependency-free and outside the shipped graph; it
# is the allocator `xtask`'s fuzz campaign and `mjx-sml`'s cell-store gate already install, not a
# second one.
mjx-allocation-counter.workspace = true

# The byte-ceiling gate is a binary of its own with no test harness, for the reason
# `crates/mjx-sml/tests/cell_store_allocation.rs` states at length: a `#[global_allocator]` is
# installed process-wide, and `cargo test` runs a harness's cases on several threads inside one
# process, so a figure measured under a harness is the figure of whatever else was running.
[[test]]
name = "glyph_atlas_allocation"
harness = false
