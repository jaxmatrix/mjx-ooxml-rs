# The SpreadsheetML markup layer, and the crate that writes the workbook a chart embeds. A chart
# carries a whole `.xlsx` package at `/ppt/embeddings/*.xlsx`, and until MJXOFF-99 this crate wrote
# one itself (`src/workbook.rs`) because `mjx-sml` did not exist and `mjx-chart -> mjx-xlsx` would
# have been an **upward** edge (2.2 -> 3.0) the layering forbids. `mjx-sml` is rank 2.1, so this edge
# points down; `xtask/tests/layering.rs` checks that rather than trusting this comment.
#
# `src/embedding.rs` is the user: it lays out which cell a chart's data belongs in and hands the rows
# to `mjx_sml::write::WorkbookPackage`, which owns every SpreadsheetML element, part name, content
# type and relationship. `src/author.rs` reaches the same crate for `column_letters`, so a chart's
# `c:f` formula and its workbook's cells cannot disagree about which column is which.
mjx-sml.workspace = true
thiserror.workspace = true
