[package]
name = "mjx-ooxml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Umbrella facade: format auto-detection, open()/save(), re-exports. Binding-ready public API."

[lints]
workspace = true

[dependencies]
mjx-ooxml-core.workspace = true
mjx-xml.workspace = true
mjx-ooxml-types.workspace = true
mjx-opc.workspace = true
mjx-mce.workspace = true
mjx-dml.workspace = true
mjx-chart.workspace = true
mjx-sml.workspace = true
mjx-pptx.workspace = true
mjx-docx.workspace = true
mjx-xlsx.workspace = true

[dev-dependencies]
# The format-detection test authors a `.pptm` and a `.potx` by rewriting one content type on a real
# package, because the repository holds no such fixture and detection must be proved on markup rather
# than on a filename. The OPC layer is the only way to do that; no other test names a crate below
# this one.
mjx-opc.workspace = true
# The committed fixture corpus, read as a directory rather than listed — `tests/preservation/` is a
# sweep over every fixture it holds, and a fixture added later must join that sweep by being there.
mjx-fixtures.workspace = true
# The counting global allocator, so `tests/workbook_boundary.rs` can hold the range-crossing
# contract to a deterministic byte ratio instead of to a stopwatch. Dependency-free and outside the
# shipped graph; it is the same allocator `xtask`'s fuzz campaign and `mjx-sml`'s cell-store gate
# install, not a third one.
mjx-allocation-counter.workspace = true

# `tests/workbook_boundary.rs` measures the facade's batched cell door against the per-cell surface
# one layer down, which it reaches through `Workbook::workbook_mut` — so it names the markup tier's
# `CellValue` to build the argument that shape takes.
mjx-sml.workspace = true

# A `#[global_allocator]` is process-wide and `cargo test` runs a harness's cases on several threads
# in one process, so a figure measured under a harness is the figure of whatever else was running.
# A plain `main` gives the boundary gate the process to itself — the same arrangement
# `crates/mjx-sml/tests/cell_store_allocation.rs` makes.
# `criterion`, for the Excel boundary bench. Dev-only; nothing on a `cargo test` path runs it.
criterion.workspace = true

# The preservation gate (MJXOFF-210): every fixture × every public `&mut self` method of the three
# surfaces. It lives in a directory rather than one file because it is a registry of 452 cases plus
# the diff primitive they are checked with; cargo only auto-discovers `tests/*.rs`, so the entry
# point is named here.
[[test]]
name = "preservation"
path = "tests/preservation/main.rs"

[[test]]
name = "workbook_boundary"
harness = false

# What a range read and a batched write cost through the facade on the MJXOFF-147 corpus, against
# the per-cell shape this facade does not offer. MJXOFF-135 measured those figures and left no
# instrument that reproduces them; this is it.
[[bench]]
name = "workbook_boundary"
harness = false

[features]
# Re-exposes mjx-pptx's legacy VML surface — the typed drawing model and the `spid` resolution an
# OLE object's or a control's legacy fallback needs (opt-in).
vml = ["mjx-pptx/vml"]
