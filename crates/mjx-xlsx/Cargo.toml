[package]
name = "mjx-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SpreadsheetML: workbook, worksheets, shared strings, styles/xf; formulas preserved as text."

[lints]
workspace = true

[dependencies]
mjx-ooxml-core.workspace = true
mjx-xml.workspace = true
mjx-derive.workspace = true
mjx-ooxml-types.workspace = true
mjx-opc.workspace = true
mjx-mce.workspace = true
mjx-dml.workspace = true
# The SpreadsheetML *markup* layer (MJXOFF-132). `mjx-sml` is rank 2.1 and this crate is rank 3.0,
# so the edge points strictly downward and `xtask/tests/layering.rs` checks it rather than trusting
# this comment. It is what makes the split real: `mjx-sml` owns what a cell, a row or an `xf` *is*;
# this crate owns the package, the part graph and the `Workbook` a caller holds. Used here today by
# `XlsxError::Sml`, which is how every later Phase D child's model failures will surface.
mjx-sml.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The shared ECMA-376 schema and child-order gate — the same harness `mjx-pptx` and `mjx-docx` are
# held to. Test-only, and nothing shipped depends on it.
mjx-schema-gate.workspace = true
# The baseline benchmarks (MJXOFF-147) and their corpus generator use `anyhow` (sanctioned in
# tooling, tests and examples, never in library code) and `criterion`. Dev-only, `harness = false`.
anyhow.workspace = true
criterion.workspace = true
# Locates the workspace root the corpus generator writes `target/corpus/` under. Dependency-free, so
# this adds no edge beyond the one every other test suite already has.
mjx-fixtures.workspace = true

[[bench]]
name = "xlsx_operations"
harness = false
