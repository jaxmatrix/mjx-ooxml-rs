[package]
name = "mjx-pptx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PresentationML: presentation, slides, layouts, masters, shape trees. First format implemented."

[lints]
workspace = true

[dependencies]
mjx-ooxml-core.workspace = true
mjx-xml.workspace = true
mjx-derive.workspace = true
mjx-ooxml-types.workspace = true
mjx-opc.workspace = true
mjx-mce.workspace = true
mjx-dml.workspace = true
mjx-chart.workspace = true
mjx-vml = { workspace = true, optional = true }
thiserror.workspace = true
unicode-segmentation.workspace = true

[features]
# Preserve-first legacy VML recognition (opt-in). Off by default: VML parts round-trip
# byte-identically regardless; this feature only surfaces them for reading.
vml = ["dep:mjx-vml"]

[dev-dependencies]
# Examples are the one place file I/O belongs — the library is bytes-in/bytes-out, and the *caller*
# reads and writes. `anyhow` is sanctioned in tooling, tests and examples, never in library code.
anyhow.workspace = true
